aid: upway
name: Upway
description: 'Upway is the largest marketplace for certified pre-owned electric bikes,
  founded in 2021 by former Uber executives Toussaint Wattinne and Stephane Ficaja. It
  buys used e-bikes from individuals, retailers and manufacturers, reconditions them
  through a 50-point inspection at its own UpCenter facilities in France, Germany,
  Belgium, the Netherlands, Spain, Italy and the United States, and resells them at up
  to 60% off with a one-year warranty. Upway has no developer program and publishes no
  OpenAPI, but it does run a real agent-facing commerce API: each of its storefronts
  serves an llms.txt and an /agents.md, a Universal Commerce Protocol merchant profile
  at /.well-known/ucp, and an anonymous Model Context Protocol endpoint whose tools/list
  returns 13 tools with full JSON Schema inputSchemas covering catalog search, cart,
  checkout and order retrieval.'
