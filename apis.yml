apis:
- aid: upway-commerce-ucp-mcp
  name: Upway Commerce (UCP MCP) API
  description: 'Upway''s agent-facing commerce surface. A remote Model Context Protocol
    server at https://upway.co/api/ucp/mcp implementing the Universal Commerce Protocol
    shopping service, version 2026-08-25. Anonymous: an unauthenticated tools/list
    returned HTTP 200 with 13 tools - search_catalog, lookup_catalog, get_product,
    create_cart, get_cart, update_cart, cancel_cart, create_checkout, get_checkout,
    update_checkout, complete_checkout, cancel_checkout and get_order - each carrying a
    JSON Schema 2020-12 inputSchema. complete_checkout requires an idempotency key and
    explicit buyer approval. Discoverable from /llms.txt, /agents.md, /.well-known/ucp
    and a dedicated agentic-discovery sitemap.'
  humanURL: https://upway.co/agents.md
  baseURL: https://upway.co/api/ucp/mcp
