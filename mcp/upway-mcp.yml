conventions_observed:
- Every tool requires a meta.ucp-agent.profile URI for UCP agent-profile discovery.
- complete_checkout additionally requires meta.idempotency-key (a required, not optional, field).
- 'Money is expressed as {"amount": <int>, "currency": <ISO 4217>} in minor units, stated in every catalog/cart/checkout
  tool description.'
- Identifiers are Shopify global IDs, e.g. gid://shopify/Checkout/abc123.
