generated: '2026-09-02'
method: probed
source: https://upway.co/api/ucp/mcp
name: Upway UCP Commerce MCP Server
description: >-
  Upway's storefront exposes a live, anonymous Model Context Protocol endpoint at
  https://upway.co/api/ucp/mcp, advertised from https://upway.co/llms.txt and
  https://upway.co/agents.md and discoverable from the UCP merchant profile at
  https://upway.co/.well-known/ucp. An unauthenticated JSON-RPC tools/list returned
  HTTP 200 with 13 tools and full JSON Schema 2020-12 inputSchemas, saved verbatim to
  mcp/upway-mcp-tools.json. The server implements the Universal Commerce Protocol
  (ucp.dev) shopping service, version 2026-08-25.
ownership: >-
  The endpoint is served on upway.co, Upway's own domain, and the UCP profile fetched
  from that host names merchant "Upway United States", merchant_origin upway.co and
  Shopify shop id 65864040675. The MCP server implementation is platform-authored
  (serverInfo.name "universal-commerce", version 0.1.0 - Shopify's UCP runtime, shared
  across Shopify stores) rather than written by Upway; what belongs to Upway is the
  catalog, the merchant profile, the payment handler configuration and the decision to
  serve it. Recorded as Upway's agent surface with platform authorship stated.
