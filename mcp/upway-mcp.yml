tools:
- name: search_catalog
  category: catalog
  description: Search for products from the online store, hosted on Shopify.
  required: [meta, catalog]
- name: lookup_catalog
  category: catalog
  description: Look up multiple products or variants by identifier.
  required: [meta, catalog]
- name: get_product
  category: catalog
  description: Retrieve complete product detail by identifier. Returns a singular product.
  required: [meta, catalog]
- name: create_cart
  category: cart
  description: Creates a new cart.
  required: [meta, cart]
- name: get_cart
  category: cart
  description: Get the cart contents.
  required: [meta, id]
- name: update_cart
  category: cart
  description: Perform updates to a cart.
  required: [meta, cart, id]
- name: cancel_cart
  category: cart
  description: Cancels a cart.
  required: [meta, id]
- name: create_checkout
  category: checkout
  description: Creates a checkout. Returns line items, totals, discounts and taxes.
  required: [meta, checkout]
- name: get_checkout
  category: checkout
  description: Returns details about the checkout, including line items, totals, discounts and taxes.
  required: [meta, id]
- name: update_checkout
  category: checkout
  description: Updates a checkout.
  required: [meta, checkout, id]
- name: complete_checkout
  category: checkout
  description: >-
    Completes a checkout and returns the checkout result, including order ID. Requires
    meta.idempotency-key. Buyer approval is mandatory before payment.
  required: [meta, id, checkout]
- name: cancel_checkout
  category: checkout
  description: Cancels a checkout.
  required: [meta, id]
- name: get_order
  category: order
  description: Get the details of an order.
  required: [meta, id]
conventions_observed:
- Every tool requires a meta.ucp-agent.profile URI for UCP agent-profile discovery.
- complete_checkout additionally requires meta.idempotency-key (a required, not optional, field).
- >-
  Money is expressed as {"amount": <int>, "currency": <ISO 4217>} in minor units, stated
  in every catalog/cart/checkout tool description.
- Identifiers are Shopify global IDs, e.g. gid://shopify/Checkout/abc123.
artifacts:
  tools_list: mcp/upway-mcp-tools.json
  ucp_profile: well-known/upway-ucp.json
  llms_txt: llms/upway-llms.txt
