gaps:
- No error-code reference, problem-type registry or troubleshooting page exists on any Upway host.
- >-
  No application-level error taxonomy is published for the commerce domain - out of
  stock, price changed, address unserviceable, payment declined - even though those are
  the failures an autonomous buying agent will actually meet. No decline-code catalog
  is emitted: Upway is the merchant, not the payment processor - card decline codes
  belong to the payment handlers declared in /.well-known/ucp (Google Pay, Shopify
  card, Shop Pay) and are not Upway's to publish.
- application/problem+json (RFC 9457) is not used; the transport is JSON-RPC.
