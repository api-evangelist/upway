name: Upway Error Catalog
description: >-
  Upway publishes no error reference. This catalog is derived from what the surface
  actually is - a JSON-RPC 2.0 server over HTTP - plus the two failure behaviours Upway
  does state in writing (429 rate limiting with back-off, and refusal of an unapproved
  payment). Every row says where it came from. Nothing here is a guessed vendor code:
  the JSON-RPC codes are the fixed codes of the transport Upway chose, not codes Upway
  invented, and where Upway has published nothing that is recorded as a gap rather than
  filled in.
format: jsonrpc-2.0
rfc9457: false
envelope:
  transport: JSON-RPC 2.0 over HTTP POST
  success_shape: '{"jsonrpc":"2.0","id":<id>,"result":{...}}'
  error_shape: '{"jsonrpc":"2.0","id":<id>,"error":{"code":<int>,"message":<string>,"data":<any>}}'
  note: >-
    Confirmed by the shape of the live 200 responses to initialize and tools/list. A
    JSON-RPC server signals application failure inside a 200 body via the error member;
    HTTP status codes cover transport-level failure only.
  content_type: application/json; charset=utf-8
