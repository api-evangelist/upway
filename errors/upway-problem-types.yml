  layer: http
  meaning: The per-IP rate limit on the MCP endpoint was exceeded.
  remediation: Back off and retry. No Retry-After header was observed, so use exponential backoff.
  method: searched
  source: https://upway.co/llms.txt
  quote: '"Respect rate limits. The MCP endpoint is rate-limited per IP. Back off on 429 responses."'
