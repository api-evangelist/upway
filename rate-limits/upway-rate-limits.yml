description: >-
  Upway documents that its agent commerce endpoint is rate limited and tells agents how
  to react, but publishes no number, window or budget. That is the finding: the runtime
  signal (429 + back off) is stated, the quantity is not, and no RateLimit-* headers
  were present on live responses.
